<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#234b43"><title>吞噬史莱姆：无尽成长</title><link rel="icon" href="data:,"><link rel="stylesheet" href="src/style.css"></head>
<body><main id="game"><div id="world"></div><div id="loading">正在铺开果冻世界…</div>
<header><div class="top"><span class="brand">SLIME / DEVOUR</span><button id="mode">关卡 / 无尽</button></div><div class="score" id="score">0</div><div class="record">本局分数　/　最佳 <span id="best">0</span></div><div class="tools"><button id="sound" aria-label="声音">音效关</button><button id="quality" aria-label="画质">自动</button><button id="pause" aria-label="暂停">Ⅱ</button><button id="restart" aria-label="重新开始">↻</button></div><div class="objective"><div class="row"><button id="levelName">01 初识果冻 ▾</button><span id="stars">☆☆☆</span></div><div id="goal">吞噬小果冻 0 / 20</div><div class="bar"><i id="progress"></i></div></div><div class="status"><div><small id="combo">连击 0</small><strong id="multiplier">×1.00</strong></div><div class="right"><b id="timer">00:00</b><small id="size">体型 0.45</small><small id="health">♥ ♥ ♥</small></div></div></header>
<div id="bossbar" hidden><span id="bosslabel"></span><div class="bar"><i id="bossfill"></i></div></div><div id="floaters"></div><div id="toast" role="status"></div>
<div id="joystick" hidden role="group" aria-label="移动摇杆"><div id="knob"></div></div>
<footer><div id="hint">拖动任意空白处移动 · 吞比你小的果冻</div><div class="controls"><div class="stat">最高连击<b id="maxCombo">0 COMBO</b></div><div class="stat right">无伤奖励<b>× 1.50</b></div></div><div class="help">按住空白处出现摇杆，拖动移动，松手隐藏 / 电脑 WASD、方向键</div></footer>
<section id="panel" hidden aria-live="polite"><h1 id="panelTitle"></h1><p id="panelText"></p><div id="panelStats"></div><div class="actions"><button id="resume">继续</button><button id="retry">再来一局</button><button id="next">下一关</button></div><div id="levelGrid" hidden></div></section><div id="rotate">请竖屏游玩<br><small>旋转手机即可继续</small></div><div id="error" hidden></div></main><script type="module" src="src/app.js"></script></body></html>
